substitutions:
  device_name: wp-cb01-dual
  friendly_name: WP-CB01 Dual Desk

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

# Logging uses the S3 USB Serial/JTAG interface and does not consume a desk UART.
logger:
  hardware_uart: USB_SERIAL_JTAG
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:

ota:
  - platform: esphome

web_server:
  port: 80

external_components:
  - source:
      type: git
      url: https://github.com/orrious/esphome_components
      ref: wp-cb01-dual-box
    components: [jsdrive]
    refresh: 1d

# All three WP-CB01 links are 9600 baud, 8 data bits, no parity, 1 stop bit.
# UART0/1/2 are routed to these GPIOs by the ESP32-S3 GPIO matrix.
uart:
  - id: remote_bus
    rx_pin: 2
    tx_pin: 1
    baud_rate: 9600
    data_bits: 8
    parity: NONE
    stop_bits: 1

  - id: box_a_bus
    rx_pin: 4
    tx_pin: 5
    baud_rate: 9600
    data_bits: 8
    parity: NONE
    stop_bits: 1

  - id: box_b_bus
    rx_pin: 15
    tx_pin: 16
    baud_rate: 9600
    data_bits: 8
    parity: NONE
    stop_bits: 1

jsdrive:
  id: desk_bridge
  remote_uart: remote_bus
  desk_uart_a: box_a_bus
  desk_uart_b: box_b_bus
  message_length: 5

  # Handset pin 5 -> ESP32 input. The component mirrors it to both boxes.
  remote_action_pin: 39
  # ESP32 outputs to each box's pin 5.
  box_a_action_pin: 9
  box_b_action_pin: 11

  # Each box's pin 8 -> ESP32 input.
  box_a_awake_pin: 41
  box_b_awake_pin: 40

  # GPIO48 -> SN74AHCT125N pin 2 (1A); pin 1 (1OE) is grounded and pin 3
  # (1Y) drives handset pin 8. The bridge drives HIGH only when both boxes'
  # pin-8 inputs are HIGH.
  remote_awake_pin: 48

  height:
    name: Desk Height
  height_a:
    name: Control Box A Height
  height_b:
    name: Control Box B Height
  in_sync:
    name: Control Boxes In Sync
    device_class: connectivity

  target_height:
    name: Target Desk Height
    unit_of_measurement: in
    icon: mdi:desk
  stop:
    name: Stop Desk
    icon: mdi:stop-circle

  up:
    name: Remote Up
  down:
    name: Remote Down
  memory1:
    name: Remote Memory 1
  memory2:
    name: Remote Memory 2
  memory3:
    name: Remote Memory 3
